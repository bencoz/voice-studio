<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>אולפן ההקלטות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@600&family=Rubik:wght@400;500;700&display=swap">
<style>
  /* The app's own tokens (docs/DESIGN_SYSTEM.md): the recorder reads the same
     glyphs, in the same face, that the child will. */
  :root {
    --ground: #F8FAFC; --surface: #FFFFFF; --ink: #1E293B; --muted: #64748B; --line: #E2E8F0;
    --sky: #0284C7; --sky-soft: #E0F2FE;
    --leaf: #15803D; --leaf-soft: #DCFCE7;
    --sun: #B45309; --sun-soft: #FEF3C7;
    --rec: #F43F5E; --rec-deep: #BE123C; --rec-soft: #FFE4E6;
    --on-accent: #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0B1220; --surface: #131C2E; --ink: #F1F5F9; --muted: #94A3B8; --line: #243044;
      --sky: #38BDF8; --sky-soft: #0C2A3D;
      --leaf: #4ADE80; --leaf-soft: #0F2E1D;
      --sun: #FBBF24; --sun-soft: #33260A;
      --rec: #FB7185; --rec-deep: #F43F5E; --rec-soft: #3A1520;
      --on-accent: #0B1220;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0B1220; --surface: #131C2E; --ink: #F1F5F9; --muted: #94A3B8; --line: #243044;
    --sky: #38BDF8; --sky-soft: #0C2A3D;
    --leaf: #4ADE80; --leaf-soft: #0F2E1D;
    --sun: #FBBF24; --sun-soft: #33260A;
    --rec: #FB7185; --rec-deep: #F43F5E; --rec-soft: #3A1520;
    --on-accent: #0B1220;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 400 17px/1.55 Rubik, "Arial Hebrew", Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  /* ---- top bar: where you are, what is waiting to be sent ---- */
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface); border-block-end: 1px solid var(--line);
    padding-block-start: env(safe-area-inset-top, 0px);
  }
  .bar-in {
    max-width: 44rem; margin-inline: auto; padding: .7rem 16px;
    display: flex; align-items: center; gap: .8rem;
  }
  .brand { display: flex; align-items: center; gap: .55rem; flex: 1; min-width: 0; }
  .brand h1 { font-size: 1.05rem; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .on-air { inline-size: .7rem; block-size: .7rem; border-radius: 50%; background: var(--line); flex: none; }
  .on-air.live { background: var(--rec); box-shadow: 0 0 0 4px var(--rec-soft); }
  .count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { block-size: 4px; background: var(--line); }
  .track > div { block-size: 100%; inline-size: 0; background: var(--leaf); transition: inline-size .3s; }

  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: .55rem 1.1rem; min-block-size: 2.9rem; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  }
  .btn.primary { background: var(--sky); border-color: var(--sky); color: var(--on-accent); }
  .btn.send { background: var(--leaf); border-color: var(--leaf); color: var(--on-accent); }
  .btn.send[disabled] { background: var(--surface); border-color: var(--line); color: var(--muted); cursor: default; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .badge {
    min-inline-size: 1.5rem; padding-inline: .35rem; border-radius: 999px; font-size: .8rem;
    background: color-mix(in srgb, var(--on-accent) 25%, transparent); font-variant-numeric: tabular-nums;
  }

  .wrap { max-width: 44rem; margin-inline: auto; padding: 1.1rem 16px 4rem; display: flex; flex-direction: column; gap: 1.1rem; }
  .intro { margin: 0; color: var(--muted); }
  .how { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .8rem 1rem; }
  .how summary { font-weight: 700; cursor: pointer; }
  .how ol { margin: .6rem 0 0; padding-inline-start: 1.3rem; display: flex; flex-direction: column; gap: .35rem; }
  .how .heb { font-family: "Noto Sans Hebrew", "Arial Hebrew", sans-serif; font-weight: 600; font-size: 1.15em; }
  .banner { margin: 0; padding: .7rem 1rem; border-radius: 12px; background: var(--sun-soft); color: var(--ink); }

  /* ---- the booth: one line at a time ---- */
  .booth {
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    padding: 1rem 1rem 1.3rem; display: flex; flex-direction: column; align-items: center; gap: .6rem;
  }
  .booth-top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .eyebrow { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill { font-size: .8rem; font-weight: 500; padding: .15rem .6rem; border-radius: 999px; background: var(--line); color: var(--ink); }
  .pill[data-status="kept"] { background: var(--sky-soft); color: var(--sky); }
  .pill[data-status="done"] { background: var(--leaf-soft); color: var(--leaf); }
  .pill[data-status="changed"], .pill[data-status="redo"] { background: var(--sun-soft); color: var(--sun); }
  .item {
    margin: .2rem 0 0; text-align: center; line-height: 1.5; overflow-wrap: anywhere;
    font-family: "Noto Sans Hebrew", "Arial Hebrew", sans-serif; font-weight: 600;
    font-size: clamp(88px, 28vw, 150px);
  }
  .item[data-len="medium"] { font-size: clamp(52px, 15vw, 92px); }
  .item[data-len="long"] { font-size: clamp(28px, 7.5vw, 44px); text-wrap: balance; }
  .aids { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .4rem .8rem; color: var(--muted); }
  .aids .emoji { font-size: 1.6rem; line-height: 1; }
  .aids .gloss-he { font-family: "Noto Sans Hebrew", "Arial Hebrew", sans-serif; font-weight: 600; color: var(--ink); }
  .ipa { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; }
  .ref { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .3rem .7rem; }
  .btn.small { min-block-size: 2.4rem; padding: .3rem .95rem; font-size: .92rem; }
  .ref-note { font-size: .82rem; color: var(--muted); }
  .addr { background: var(--sky-soft); color: var(--sky); }
  .note { margin: 0; padding: .5rem .9rem; border-radius: 10px; background: var(--sun-soft); text-align: center; }
  .hint { margin: 0; color: var(--muted); text-align: center; font-size: .95rem; max-inline-size: 34ch; }

  .deck { display: flex; align-items: center; justify-content: center; gap: 1.2rem; margin-block-start: .4rem; }
  .rec {
    inline-size: 6.5rem; block-size: 6.5rem; border-radius: 50%; border: 0; position: relative;
    background: var(--rec); display: grid; place-items: center;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--rec) 35%, transparent);
  }
  .rec-core { inline-size: 2.1rem; block-size: 2.1rem; border-radius: 50%; background: var(--on-accent); transition: border-radius .15s, inline-size .15s, block-size .15s; }
  .rec[aria-pressed="true"] .rec-core { border-radius: 7px; inline-size: 1.8rem; block-size: 1.8rem; }
  .rec[aria-pressed="true"]::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 3px solid var(--rec); animation: pulse 1.2s ease-out infinite;
  }
  @keyframes pulse { from { opacity: .9; transform: scale(.94); } to { opacity: 0; transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .rec[aria-pressed="true"]::after { animation: none; opacity: .6; } }
  .rec-label { font-weight: 700; color: var(--rec-deep); }
  .level { inline-size: min(16rem, 100%); block-size: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .level > div { block-size: 100%; inline-size: 0; background: var(--leaf); }
  .warn { margin: 0; color: var(--sun); font-weight: 500; text-align: center; }
  .review { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; }
  .sendbox { display: flex; flex-direction: column; gap: .5rem; align-items: stretch; background: var(--leaf-soft); border-radius: 14px; padding: .9rem 1rem; }
  .sendbox p { margin: 0; font-size: .92rem; }
  .sendbox .again { align-self: start; font-size: .9rem; color: var(--leaf); background: none; border: 0; padding: 0; text-decoration: underline; }

  /* ---- the whole script, by section ---- */
  .list-head { display: flex; justify-content: flex-end; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
  .seg button { border: 0; background: none; border-radius: 999px; padding: .35rem .9rem; font-size: .9rem; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .group { display: flex; flex-direction: column; gap: .5rem; }
  .group h2 { margin: .4rem 0 0; font-size: 1rem; display: flex; align-items: baseline; gap: .6rem; }
  .group h2 .count { font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    min-inline-size: 3rem; min-block-size: 3rem; padding: .2rem .7rem; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface);
    font-family: "Noto Sans Hebrew", "Arial Hebrew", sans-serif; font-weight: 600; font-size: 1.3rem;
  }
  .chip.long { font-size: .95rem; }
  .chip[data-status="kept"] { background: var(--sky-soft); border-color: transparent; }
  .chip[data-status="done"] { background: var(--leaf-soft); border-color: transparent; color: var(--leaf); }
  .chip[data-status="changed"], .chip[data-status="redo"] { background: var(--sun-soft); border-color: var(--sun); }
  .chip[aria-current="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }
  .done-all { margin: 0; color: var(--leaf); font-weight: 500; }

  .toast {
    position: fixed; inset-inline: 16px; inset-block-end: calc(16px + env(safe-area-inset-bottom, 0px));
    margin: 0 auto; max-inline-size: 30rem; padding: .8rem 1rem; border-radius: 14px;
    background: var(--ink); color: var(--ground); text-align: center; z-index: 10;
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><span id="on-air" class="on-air" aria-hidden="true"></span><h1 id="title"></h1></div>
    <span id="progress" class="count"></span>
    <button id="send" class="btn send" data-testid="send"><span id="send-label"></span><span id="send-count" class="badge"></span></button>
  </div>
  <div class="track"><div id="track-fill"></div></div>
</header>

<main class="wrap">
  <p id="intro" class="intro"></p>
  <details id="how" class="how"><summary id="how-title"></summary><ol id="how-list"></ol></details>
  <p id="banner" class="banner" role="alert" hidden></p>

  <section class="booth" aria-live="polite">
    <div class="booth-top"><span id="eyebrow" class="eyebrow"></span><span id="pill" class="pill" data-testid="status"></span></div>
    <p id="item" class="item" data-testid="item"></p>
    <div class="aids">
      <span id="emoji" class="emoji"></span>
      <span id="gloss"></span>
      <bdi id="ipa" class="ipa" dir="ltr"></bdi>
      <span id="addr" class="pill addr"></span>
    </div>
    <div id="ref-row" class="ref">
      <button id="example" class="btn small" data-testid="example"></button>
      <span id="example-note" class="ref-note"></span>
    </div>
    <p id="note" class="note"></p>
    <p id="hint" class="hint"></p>
    <div class="deck">
      <button id="prev" class="btn ghost"></button>
      <button id="rec" class="rec" aria-pressed="false" data-testid="record"><span class="rec-core"></span></button>
      <button id="skip" class="btn ghost"></button>
    </div>
    <span id="rec-label" class="rec-label"></span>
    <div class="level" aria-hidden="true"><div id="level-fill"></div></div>
    <p id="warn" class="warn"></p>
    <div id="review" class="review">
      <button id="again" class="btn" data-testid="again"></button>
      <button id="play" class="btn" data-testid="play"></button>
      <button id="keep" class="btn primary" data-testid="keep"></button>
    </div>
  </section>

  <div id="sendbox" class="sendbox">
    <p id="send-note"></p>
    <button id="send-all" class="again" data-testid="send-all"></button>
  </div>

  <section class="list">
    <div class="list-head">
      <div class="seg" role="group">
        <button id="f-left" aria-pressed="true"></button>
        <button id="f-all" aria-pressed="false" data-testid="filter-all"></button>
      </div>
    </div>
    <div id="groups"></div>
  </section>
</main>
<p id="toast" class="toast" role="status" hidden></p>

  // ---------------------------------------------------------------- storage
  // Takes are kept on this device between visits, as a convenience. Sending is
  // what makes them safe, so the page works (and says so) without storage.
  let db = null;
  const openDb = () => new Promise((resolve) => {
    try {
      const req = indexedDB.open('voice-studio', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('takes', { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    } catch { resolve(null); }
  });
  const store = (mode, fn) => new Promise((resolve) => {
    if (!db) return resolve(null);
    try {
      const t = db.transaction('takes', mode);
      const req = fn(t.objectStore('takes'));
      t.oncomplete = () => resolve(req ? req.result : null);
      t.onerror = t.onabort = () => resolve(null);
    } catch { resolve(null); }
  });

  /** id -> {id, hash, buf, mime, recordedAt, ms, sent} */
  const takes = new Map();

  /** A take counts only if it answers the text on screen now, and any redo request. */
  const localTake = (c) => {
    const t = takes.get(c.id);
    if (!t || t.hash !== c.hash) return null;
    if (c.redoAt && t.recordedAt <= c.redoAt) return null;
    return t;
  };
  const statusOf = (c) => {
    const t = localTake(c);
    if (t) return t.sent ? 'done' : 'kept';
    return c.status;
  };
  const unsent = () => CLIPS.filter((c) => statusOf(c) === 'kept');

  // ------------------------------------------------------------------ state
  let current = null;
  let filter = 'left';
  let phase = 'idle'; // idle | starting | recording | review
  let pending = null; // {blob, ms, mime, url, at}
  let peak = 0;
  let clipped = 0;

  const nextNeeding = (fromIdx) => {
    for (let k = 1; k <= CLIPS.length; k++) {
      const c = CLIPS[(fromIdx + k + CLIPS.length) % CLIPS.length];
      if (NEEDS.has(statusOf(c))) return c.id;
    }
    return null;
  };
  const indexOf = (id) => CLIPS.findIndex((c) => c.id === id);

  // --------------------------------------------------------------- recorder
  const MIME = (() => {
    if (typeof MediaRecorder === 'undefined') return null;
    for (const m of ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm']) {
      try { if (MediaRecorder.isTypeSupported(m)) return m; } catch { /* keep looking */ }
    }
    return '';
  })();
  let stream = null;
  let source = null;
  let analyser = null;
  let audioCtx = null;
  let wakeLock = null;
  let rec = null;
  let chunks = [];
  let t0 = 0;
  let recAt = 0;
  let raf = 0;
  let autoStop = 0;
  const player = new Audio();

  const openMic = async () => {
    if (!navigator.mediaDevices?.getUserMedia || MIME === null) { banner(S.micMissing); return false; }
    try {
      // Raw signal: the browser's voice-call processing smears half-second
      // syllables. Loudness is evened out on import.
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
      });
    } catch {
      banner(S.micDenied);
      return false;
    }
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (!analyser) {
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
      }
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
    } catch { analyser = null; }
    if (!wakeLock) { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { /* optional */ } }
    return true;
  };

  // While a page holds the microphone, phones play sound through the phone-call
  // path: quiet and thin. So the mic is closed after every take, and the
  // playback sounds like what was actually recorded.
  const closeMic = () => {
    try { source?.disconnect(); } catch { /* already gone */ }
    source = null;
    stream?.getTracks().forEach((t) => t.stop());
    stream = null;
  };

  const meter = () => {
    const bar = $('level-fill');
    if (!analyser) return;
    const buf = new Float32Array(analyser.fftSize);
    const tick = () => {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (const v of buf) {
        sum += v * v;
        const a = Math.abs(v);
        if (a > peak) peak = a;
        if (a >= 0.98) clipped++;
      }
      bar.style.inlineSize = `${Math.min(100, Math.sqrt(sum / buf.length) * 400)}%`;
      if (phase === 'recording') raf = requestAnimationFrame(tick);
      else bar.style.inlineSize = '0%';
    };
    tick();
  };

  const startRecording = async () => {
    if (phase === 'starting' || phase === 'recording') return;
    phase = 'starting';
    player.pause();
    discardPending();
    if (!(await openMic())) { phase = 'idle'; render(); return; }
    if (audioCtx?.state === 'suspended') { try { await audioCtx.resume(); } catch { /* meter only */ } }
    // A freshly opened mic can click in its first moments; let it settle.
    await new Promise((resolve) => setTimeout(resolve, 150));
    chunks = [];
    peak = 0;
    clipped = 0;
    const opts = { audioBitsPerSecond: 128000 };
    if (MIME) opts.mimeType = MIME;
    try { rec = new MediaRecorder(stream, opts); } catch { rec = new MediaRecorder(stream); }
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = stopped;
    recAt = Date.now();
    rec.start();
    t0 = performance.now();
    phase = 'recording';
    render();
    meter();
    autoStop = setTimeout(stopRecording, 12000);
  };

  const stopRecording = () => {
    clearTimeout(autoStop);
    cancelAnimationFrame(raf);
    if (rec && rec.state === 'recording') rec.stop();
  };

  const stopped = () => {
    const mime = rec.mimeType || MIME || 'audio/webm';
    const blob = new Blob(chunks, { type: mime });
    pending = { blob, mime, ms: Math.round(performance.now() - t0), url: URL.createObjectURL(blob), at: recAt };
    closeMic();
    phase = 'review';
    render();
    play();
  };

  const discardPending = () => {
    if (pending) URL.revokeObjectURL(pending.url);
    pending = null;
  };

  const play = () => {
    const src = pending ? pending.url : null;
    if (!src) return;
    player.src = src;
    player.play().catch(() => { /* the Play button is right there */ });
  };

  // The app's current clip for this line, as a guide to the sound.
  const playExample = () => {
    const c = BY_ID.get(current);
    if (!c.ref || phase === 'starting' || phase === 'recording') return;
    player.src = `ref/${c.id}.mp3`;
    player.play().catch(() => { /* tap again */ });
  };

  const keep = async () => {
    if (!pending) return;
    const c = BY_ID.get(current);
    const take = {
      id: c.id, hash: c.hash, buf: await pending.blob.arrayBuffer(), mime: pending.mime,
      recordedAt: pending.at, ms: pending.ms, sent: false,
    };
    takes.set(c.id, take);
    await store('readwrite', (s) => s.put(take));
    discardPending();
    phase = 'idle';
    current = nextNeeding(indexOf(c.id)) ?? c.id;
    render();
  };

  // ------------------------------------------------------------------- send
  const b64 = (buf) => {
    const bytes = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const stamp = () => {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  };
  const download = (file) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  };
  const markSent = async (list) => {
    for (const t of list) {
      t.sent = true;
      await store('readwrite', (s) => s.put(t));
    }
  };

  // Everything before navigator.share stays synchronous: browsers only open
  // the share sheet inside the tap that asked for it.
  const send = (all) => {
    const list = CLIPS.map(localTake).filter((t) => t && (all || !t.sent));
    if (!list.length) return toast(S.nothingToSend);
    const payload = {
      format: 'voice-takes/1',
      studioVersion: DATA.version,
      takes: list.map((t) => ({ id: t.id, hash: t.hash, mime: t.mime, recordedAt: t.recordedAt, ms: t.ms, b64: b64(t.buf) })),
    };
    // .txt, not .json: Chrome on Android only shares an allowlist of file
    // types, and JSON is not on it, so it would silently download instead.
    const file = new File([JSON.stringify(payload)], `voice-takes-${stamp()}.txt`, { type: 'text/plain' });
    const phone = matchMedia('(pointer: coarse)').matches;
    if (phone && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] })
        .then(async () => { await markSent(list); toast(S.sentShare); render(); })
        .catch(async (e) => {
          if (e && e.name === 'AbortError') return;
          download(file);
          await markSent(list);
          toast(S.sentDownload);
          render();
        });
      return;
    }
    download(file);
    markSent(list).then(() => { toast(S.sentDownload); render(); });
  };

  // ----------------------------------------------------------------- render
  const lengthOf = (text) => {
    const letters = text.replace(/[֑-ׇ]/g, '').length;
    return letters <= 4 ? 'short' : letters <= 10 ? 'medium' : 'long';
  };
  const setText = (id, text) => {
    const el = $(id);
    el.textContent = text || '';
    el.hidden = !text;
  };

  const renderBar = () => {
    const done = CLIPS.filter((c) => !NEEDS.has(statusOf(c))).length;
    $('progress').textContent = fill(S.progress, { done, total: CLIPS.length });
    $('track-fill').style.inlineSize = `${(done / CLIPS.length) * 100}%`;
    const n = unsent().length;
    $('send').disabled = n === 0;
    $('send-count').textContent = n ? String(n) : '';
    $('send-count').hidden = !n;
    $('sendbox').hidden = n === 0;
    $('send-note').textContent = `${fill(S.waiting, { n })}. ${S.sendNote}`;
    $('on-air').classList.toggle('live', phase === 'recording');
  };

  const renderBooth = () => {
    const c = BY_ID.get(current);
    const inCat = CLIPS.filter((x) => x.cat === c.cat);
    $('eyebrow').textContent = `${S.categories[c.cat] ?? c.cat} · ${fill(S.position, { i: inCat.indexOf(c) + 1, n: inCat.length })}`;
    const status = statusOf(c);
    $('pill').dataset.status = status;
    $('pill').textContent = S.status[status];
    const item = $('item');
    item.textContent = c.text;
    item.dataset.len = lengthOf(c.text);
    setText('emoji', c.emoji);
    const gloss = $('gloss');
    gloss.textContent = c.gloss || '';
    gloss.hidden = !c.gloss;
    gloss.className = /[א-ת]/.test(c.gloss || '') ? 'gloss-he' : '';
    setText('ipa', c.ipa ? `/${c.ipa}/` : '');
    setText('addr', c.address ? S.address[c.address] : '');
    setText('note', status === 'redo' && c.note ? `${S.note} ${c.note}` : '');
    setText('hint', S.hints[c.cat]);
    $('ref-row').hidden = !c.ref;
    // Stopping cancels the meter's next frame, so its last level would stick.
    if (phase !== 'recording') $('level-fill').style.inlineSize = '0%';
    $('example').disabled = phase === 'starting' || phase === 'recording';

    const recBtn = $('rec');
    recBtn.setAttribute('aria-pressed', String(phase === 'recording'));
    recBtn.setAttribute('aria-label', phase === 'recording' ? S.stop : S.record);
    $('rec-label').textContent = phase === 'recording' ? S.recording : S.record;
    $('review').hidden = phase !== 'review';
    let warn = '';
    if (phase === 'review' && analyser) {
      if (clipped > 30) warn = S.tooLoud;
      else if (peak < 0.03) warn = S.tooQuiet;
    }
    setText('warn', warn);
  };

  const renderList = () => {
    const groups = $('groups');
    groups.textContent = '';
    for (const cat of CATS) {
      const all = CLIPS.filter((c) => c.cat === cat);
      const left = all.filter((c) => NEEDS.has(statusOf(c)));
      const shown = filter === 'all' ? all : left;
      const section = document.createElement('section');
      section.className = 'group';
      const h = document.createElement('h2');
      h.textContent = S.categories[cat] ?? cat;
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = fill(S.progress, { done: all.length - left.length, total: all.length });
      h.append(count);
      section.append(h);
      if (!shown.length) {
        const p = document.createElement('p');
        p.className = 'done-all';
        p.textContent = '✓';
        section.append(p);
      } else {
        const chips = document.createElement('div');
        chips.className = 'chips';
        for (const c of shown) {
          const b = document.createElement('button');
          b.className = lengthOf(c.text) === 'long' ? 'chip long' : 'chip';
          b.textContent = c.text;
          b.dataset.status = statusOf(c);
          b.dataset.id = c.id;
          b.setAttribute('aria-current', String(c.id === current));
          b.title = S.status[statusOf(c)];
          chips.append(b);
        }
        section.append(chips);
      }
      groups.append(section);
    }
  };

  const render = () => { renderBar(); renderBooth(); renderList(); };

  let toastTimer = 0;
  const toast = (msg) => {
    const t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  };
  const banner = (msg) => { setText('banner', msg); };

  const select = (id) => {
    if (phase === 'recording') return;
    player.pause();
    discardPending();
    phase = 'idle';
    current = id;
    render();
    $('item').scrollIntoView({ block: 'center', behavior: 'smooth' });
  };

  // ------------------------------------------------------------------ wiring
  const staticText = () => {
    document.title = S.docTitle;
    $('title').textContent = S.docTitle;
    $('intro').textContent = S.intro;
    $('how-title').textContent = S.howTitle;
    const ex = DATA.examples;
    const list = $('how-list');
    for (const line of S.how) {
      const li = document.createElement('li');
      // The examples are Hebrew from src/data; set them in the glyph face.
      for (const part of line.split(/(\{\w+\})/)) {
        const key = /^\{(\w+)\}$/.exec(part)?.[1];
        if (key && ex[key]) {
          const span = document.createElement('span');
          span.className = 'heb';
          span.textContent = ex[key];
          li.append(span);
        } else li.append(part);
      }
      list.append(li);
    }
    $('send-label').textContent = S.send;
    $('send-all').textContent = S.sendAll;
    $('again').textContent = S.again;
    $('play').textContent = `▶ ${S.play}`;
    $('example').textContent = `▶ ${S.example}`;
    $('example-note').textContent = S.exampleNote;
    $('keep').textContent = S.keep;
    $('prev').textContent = S.prev;
    $('skip').textContent = S.skip;
    $('f-left').textContent = S.filterLeft;
    $('f-all').textContent = S.filterAll;
  };

  $('rec').addEventListener('click', () => (phase === 'recording' ? stopRecording() : startRecording()));
  $('again').addEventListener('click', startRecording);
  $('play').addEventListener('click', play);
  $('example').addEventListener('click', playExample);
  $('keep').addEventListener('click', keep);
  $('send').addEventListener('click', () => send(false));
  $('send-all').addEventListener('click', () => send(true));
  $('prev').addEventListener('click', () => select(CLIPS[(indexOf(current) - 1 + CLIPS.length) % CLIPS.length].id));
  $('skip').addEventListener('click', () => select(nextNeeding(indexOf(current)) ?? CLIPS[(indexOf(current) + 1) % CLIPS.length].id));
  $('groups').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) select(chip.dataset.id);
  });
  const setFilter = (f) => {
    filter = f;
    $('f-left').setAttribute('aria-pressed', String(f === 'left'));
    $('f-all').setAttribute('aria-pressed', String(f === 'all'));
    renderList();
  };
  $('f-left').addEventListener('click', () => setFilter('left'));
  $('f-all').addEventListener('click', () => setFilter('all'));
  // On a laptop: Space records and stops, Enter keeps.
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('button, summary, input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); $('rec').click(); }
    else if (e.key === 'Enter' && phase === 'review') { e.preventDefault(); keep(); }
  });

  const boot = async () => {
    staticText();
    db = await openDb();
    if (!db) banner(S.noStorage);
    const saved = (await store('readonly', (s) => s.getAll())) || [];
    for (const t of saved) takes.set(t.id, t);
    current = nextNeeding(-1) ?? CLIPS[0].id;
    $('how').open = !CLIPS.some((c) => localTake(c)) && CLIPS.every((c) => c.status !== 'done');
    if (!nextNeeding(-1)) toast(S.allDone);
    render();
  };
  boot();
})();
</script>
</body>
</html>
